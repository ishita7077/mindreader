<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MindReader — Opening audio result</title>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var jobId = params.get("jobId") || params.get("job_id") || params.get("job");
  var side = params.get("side") || "a";
  var target = jobId
    ? "/rep-message-analyst-neon.html?jobId=" + encodeURIComponent(jobId) + "&side=" + encodeURIComponent(side) + "&reveal=1"
    : "/launch";
  location.replace(target);
})();
</script>
</head>
<body>
<p>Opening MindReader result…</p>
</body>
</html>
